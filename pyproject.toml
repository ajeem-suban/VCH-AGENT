[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vch-agent"
version = "0.1.0"
description = "Local-first foundations for Viral Content Hunter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0,<3",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
vch = "vch.cli:main"

[project.optional-dependencies]
local-llm = [
    "llama-cpp-python>=0.3",
]
reddit = [
    "praw>=7.8,<9",
]
transcripts = [
    "youtube-transcript-api>=1.2,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
